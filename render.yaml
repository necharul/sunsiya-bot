services:
  - type: web
    name: sunsiya-ai-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: VERIFY_TOKEN
        value: sunsiya_verify_2024
      - key: PAGE_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_ENABLED
        sync: false
      - key: ADMIN_TOKEN
        sync: false
